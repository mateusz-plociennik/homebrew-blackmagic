name: Bump casks

# `brew bump` is the whole scraper. It runs each cask's `livecheck` — which reads Blackmagic's release
# catalog — compares the result against the version pinned in the cask, asks GitHub whether a bump PR
# for that version already exists, and hands anything genuinely new to `brew bump-cask-pr`, which
# downloads the artifact, computes the `sha256`, and opens the PR. Since the `downloadId` is looked up
# from the version at fetch time, `--version` is all it needs; nothing has to patch the cask
# afterwards.
#
# Note that computing a checksum means downloading the real artifact: ~350 MB for Ethernet Switch,
# multiple GB for DaVinci Resolve. That is unavoidable, and it is why this runs on a schedule rather
# than on every push.

on:
  schedule:
    # Every third day. Blackmagic ship releases irregularly, so there is no window worth targeting.
    - cron: "17 6 */3 * *"
  workflow_dispatch:
    inputs:
      report-only:
        description: Report what would be bumped without opening pull requests
        type: boolean
        default: false

concurrency:
  # Never two bumps at once: the second would push the same branch name.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  bump:
    # livecheck, download and sha256 are platform-independent; the macOS install check is ci.yml's.
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          # The token pushes bump branches and opens PRs. `BUMP_TOKEN` is optional: set it to a PAT if
          # you want the bump PRs to trigger the CI workflow, which `GITHUB_TOKEN`-authored PRs
          # deliberately do not.
          token: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          brew-gh-api-token: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          cask: true

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ubuntu-latest-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ubuntu-latest-rubygems-

      - name: Trust the tap
        # Loading a cask from this tap runs its custom download strategy, which Homebrew refuses to do
        # for an untrusted tap. `setup-homebrew` already trusts the tap it checks out, so this reports
        # "Already trusted" today; it is kept because everything after it fails without trust and the
        # failure would not name trust as the cause.
        run: brew trust --tap ${{ steps.set-up-homebrew.outputs.tap-name }}

      - name: Drop orphaned bump branches
        # A run that pushes `bump-<cask>-<version>` and then fails before its PR exists leaves the
        # branch behind, and the next run's push of a fresh commit for the same version is rejected
        # non-fast-forward — so one bad run wedges that cask's bump forever. `brew bump` skips a cask
        # whose PR is already open, so any `bump-*` branch with no open PR is spent: delete it.
        if: inputs.report-only != true
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # `--limit` because `gh pr list` pages at 30 by default, and a bump PR that fell off the
          # first page would have its branch read as orphaned and deleted out from under it.
          open_prs=$(gh pr list --repo "$REPO" --state open --limit 500 --json headRefName \
                       --jq '.[].headRefName')
          branches=$(gh api --paginate "repos/$REPO/git/matching-refs/heads/bump-" --jq '.[].ref' |
                       sed 's|^refs/heads/||')
          for branch in $branches; do
            if grep -qxF "$branch" <<<"$open_prs"; then
              echo "Keeping $branch: its pull request is open"
            else
              echo "Deleting orphaned $branch"
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
            fi
          done

      - name: Record open PRs
        if: inputs.report-only != true
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr list --repo "$REPO" --state open --limit 500 --json number \
            --jq '.[].number' | sort > "$RUNNER_TEMP/open-before"

      - name: Run brew bump
        env:
          HOMEBREW_GIT_NAME: github-actions[bot]
          HOMEBREW_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          HOMEBREW_NO_INSTALL_FROM_API: 1
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
          REPORT_ONLY: ${{ inputs.report-only }}
        run: |
          # `--no-fork` pushes the bump branch to this repository rather than a fork; the token above
          # is what authorises that push. Built as a bash array rather than a workflow expression of
          # the form "cond && A || B", where an empty A is falsy and silently selects B. Note that
          # GitHub parses expression delimiters even inside a shell comment, so one cannot be written
          # out here as an example.
          args=(--cask --tap "$TAP")
          [[ "$REPORT_ONLY" == "true" ]] || args+=(--open-pr --no-fork)
          brew bump "${args[@]}"

      - name: Verify and annotate new bump PRs
        # `!cancelled()` so a PR opened before another cask's bump failed still gets verified.
        if: ${{ !cancelled() && inputs.report-only != true }}
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          set -euo pipefail
          # Read from ci.yml so the comment and the install job cannot disagree about what is skipped.
          skip=$(sed -n 's/^ *SKIP_CASKS: *//p' "$(brew --repo "$TAP")/.github/workflows/ci.yml")
          gh pr list --repo "$REPO" --state open --limit 500 --json number \
            --jq '.[].number' | sort > "$RUNNER_TEMP/open-after"
          for pr in $(comm -13 "$RUNNER_TEMP/open-before" "$RUNNER_TEMP/open-after"); do
            branch=$(gh pr view "$pr" --repo "$REPO" --json headRefName --jq .headRefName)
            [[ "$branch" == bump-* ]] || continue
            diff=$(gh pr diff "$pr" --repo "$REPO")
            cask=$(sed -n 's|^+++ b/Casks/\(.*\)\.rb$|\1|p' <<<"$diff" | head -1)
            old=$(sed -n 's/^-  version "\(.*\)"$/\1/p' <<<"$diff")
            new=$(sed -n 's/^+  version "\(.*\)"$/\1/p' <<<"$diff")

            gh workflow run ci.yml --repo "$REPO" --ref "$branch" -f pr="$pr"

            runs="https://github.com/$REPO/actions/workflows/ci.yml?query=branch%3A$branch"
            {
              echo "### Next steps"
              echo
              echo "[CI]($runs) was dispatched on this branch."
              echo "It runs style, audit, the tests, and a real install + uninstall of \`$cask\` on a fresh runner."
              echo
              if [[ " $skip " == *" $cask "* ]]; then
                echo "- [ ] \`$cask\` is registration-gated, so CI skips the install. Before merging, run locally:"
                echo "      \`brew install --cask $TAP/$cask && brew uninstall --cask $TAP/$cask\`"
              else
                echo "- [ ] CI green → merge. The install proves the \`pkg\` name, the uninstall proves the receipts."
                echo "- [ ] CI red on **install** → this release renamed its pkg or receipts. Fix the cask on this branch;"
                echo "      To see what the artifact contains now, scaffold a throwaway copy into a temp dir (downloads the full artifact):"
                echo "      \`cd \"\$(brew --repo $TAP)\" && brew ruby -e 'require \"./lib/bmd_cask_generator\"; Dir.mktmpdir { |d| puts File.read(BmdCaskGenerator.generate(ARGV[0], version: ARGV[1], casks_dir: d)) }' \"<Product>\" $new\`"
                echo "      \`<Product>\` is the cask's \`data: { \"product\" => … }\` value. \`bin/generate-cask\` itself refuses an existing cask."
              fi
              if [[ "${old%%.*}" != "${new%%.*}" ]]; then
                echo "- [ ] Major version ($old → $new): check Blackmagic's release notes for a raised macOS minimum."
                echo "      Bumps never raise \`depends_on\`, and CI's runner is on the newest macOS so it can't catch one."
              fi
            } > "$RUNNER_TEMP/comment.md"
            gh pr comment "$pr" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          done
