name: Bump casks

# `brew bump` is the whole scraper. It runs each cask's `livecheck` — which reads Blackmagic's release
# catalog — compares the result against the version pinned in the cask, asks GitHub whether a bump PR
# for that version already exists, and hands anything genuinely new to `brew bump-cask-pr`, which
# downloads the artifact, computes the `sha256`, and opens the PR. Since the `downloadId` is looked up
# from the version at fetch time, `--version` is all it needs; nothing has to patch the cask
# afterwards.
#
# Note that computing a checksum means downloading the real artifact: ~350 MB for Ethernet Switch,
# multiple GB for DaVinci Resolve. That is unavoidable, and it is why this runs on a schedule rather
# than on every push.

on:
  schedule:
    # Mondays and Thursdays. Blackmagic ship releases irregularly, so there is no window worth targeting.
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
    inputs:
      report-only:
        description: Report what would be bumped without opening pull requests
        type: boolean
        default: false

concurrency:
  # Never two bumps at once: the second would push the same branch name.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  bump:
    # macOS: `bump-cask-pr` runs `brew audit --online`, which extracts the DMG with `hdiutil`.
    runs-on: macos-latest
    # Holds the owner's `HOMEBREW_BMD_TAP_*` registration secrets, used by `Run brew bump` only. See
    # `audit-online.yml` and CONTRIBUTING.md.
    environment: bmd-registration
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          # The token pushes bump branches and opens PRs. `BUMP_TOKEN` is optional: without it, the
          # `pull_request` run of a `GITHUB_TOKEN`-authored PR waits for manual approval, so the last
          # step dispatches CI instead. A PAT here makes the `pull_request` run start by itself.
          token: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          brew-gh-api-token: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          cask: true
          # Off even on an Actions debug re-run; see `audit-online.yml`.
          debug: false

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-latest-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-latest-rubygems-

      - name: Trust the tap
        # Loading a cask from this tap runs its custom download strategy, which Homebrew refuses to do
        # for an untrusted tap. `setup-homebrew` already trusts the tap it checks out, so this reports
        # "Already trusted" today; it is kept because everything after it fails without trust and the
        # failure would not name trust as the cause.
        run: brew trust --tap ${{ steps.set-up-homebrew.outputs.tap-name }}

      - name: Drop orphaned bump branches
        # A run that pushes `bump-<cask>-<version>` and then fails before its PR exists leaves the
        # branch behind, and the next run's push of a fresh commit for the same version is rejected
        # non-fast-forward — so one bad run wedges that cask's bump forever. `brew bump` skips a cask
        # whose PR is already open, so any `bump-*` branch with no open PR is spent: delete it.
        if: inputs.report-only != true
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # `--limit` because `gh pr list` pages at 30 by default, and a bump PR that fell off the
          # first page would have its branch read as orphaned and deleted out from under it.
          open_prs=$(gh pr list --repo "$REPO" --state open --limit 500 --json headRefName \
                       --jq '.[].headRefName')
          branches=$(gh api --paginate "repos/$REPO/git/matching-refs/heads/bump-" --jq '.[].ref' |
                       sed 's|^refs/heads/||')
          for branch in $branches; do
            if grep -qxF "$branch" <<<"$open_prs"; then
              echo "Keeping $branch: its pull request is open"
            else
              echo "Deleting orphaned $branch"
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
            fi
          done

      - name: Run brew bump
        env:
          HOMEBREW_GIT_NAME: github-actions[bot]
          HOMEBREW_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          HOMEBREW_NO_INSTALL_FROM_API: 1
          # Files the manual-bump issues for casks that need registration; see the script.
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
          REPORT_ONLY: ${{ inputs.report-only }}
          # Lets `bump-cask-pr` download releases that need registration (#107). Unset, the script
          # files a manual-bump issue instead.
          HOMEBREW_BMD_TAP_FIRSTNAME: ${{ secrets.HOMEBREW_BMD_TAP_FIRSTNAME }}
          HOMEBREW_BMD_TAP_LASTNAME: ${{ secrets.HOMEBREW_BMD_TAP_LASTNAME }}
          HOMEBREW_BMD_TAP_EMAIL: ${{ secrets.HOMEBREW_BMD_TAP_EMAIL }}
          HOMEBREW_BMD_TAP_PHONE: ${{ secrets.HOMEBREW_BMD_TAP_PHONE }}
          HOMEBREW_BMD_TAP_COMPANY: ${{ secrets.HOMEBREW_BMD_TAP_COMPANY }}
          HOMEBREW_BMD_TAP_STREET: ${{ secrets.HOMEBREW_BMD_TAP_STREET }}
          HOMEBREW_BMD_TAP_CITY: ${{ secrets.HOMEBREW_BMD_TAP_CITY }}
          HOMEBREW_BMD_TAP_STATE: ${{ secrets.HOMEBREW_BMD_TAP_STATE }}
          HOMEBREW_BMD_TAP_COUNTRY: ${{ secrets.HOMEBREW_BMD_TAP_COUNTRY }}
        # `--no-fork` (in the script) pushes the bump branch to this repository rather than a fork;
        # the token above is what authorises that push.
        run: '"$(brew --repo "$TAP")/bin/bump-casks"'

      - name: Verify and annotate bump PRs
        # `!cancelled()` so a PR opened before another cask's bump failed still gets verified. PRs a
        # cancelled run left behind are caught by the next run: the script checks every open bump PR.
        if: ${{ !cancelled() && inputs.report-only != true }}
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: '"$(brew --repo "$TAP")/bin/dispatch-bump-ci"'

      - name: Report to the failure issue
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: '"$(brew --repo "$TAP")/bin/report-run" "${{ job.status }}"'
