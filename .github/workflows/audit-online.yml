name: Audit casks online

# `brew audit --cask --online` does pass for this tap's casks, contrary to what the comment on
# `resolve_url_basename_time_file_size` used to claim (#7): `Cask::Audit#audit_url_https_availability`
# returns early for any `url` with a `using:` strategy, so the deliberately-404ing unsigned path is
# never probed, and `audit_download` fetches through `BmdDownloadStrategy#_fetch`, which mints a real
# signed URL.
#
# It is just expensive. `audit_download` downloads the whole artifact — ~350 MB for Ethernet Switch,
# multiple GB for Resolve — which is why this is not part of the per-PR `ci.yml` (that stays on
# `--only-tap-syntax`, which is style plus an offline audit) and runs weekly instead.
#
# What this adds over the offline audit: proof that Blackmagic's resolve endpoint still answers, that
# the artifact behind each pinned version is still reachable, and that its bytes still match the
# pinned `sha256`. `bump.yml` proves the same thing for versions that changed; this covers the ones
# that did not.

on:
  schedule:
    # Weekly. Daily would re-download several GB to re-learn the same answer.
    - cron: "43 5 * * 1"
  workflow_dispatch:
    inputs:
      casks:
        description: "Space-separated cask tokens to audit; empty audits every cask but the skipped ones"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  # Casks never audited here. Empty: registration-path casks (Resolve) resolve with the owner's details
  # from the `bmd-registration` environment, see the Audit step (#107).
  SKIP_CASKS: ""

jobs:
  audit:
    # macOS: the online audit extracts the DMG with `hdiutil`.
    runs-on: macos-latest
    # Holds the owner's `HOMEBREW_BMD_TAP_*` registration secrets. Limited to `main` in the repository
    # settings, so only scheduled and manual runs of reviewed code can read them, never PR code. See
    # CONTRIBUTING.md.
    environment: bmd-registration
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          cask: true
          # Defaults to on for an Actions debug re-run, and turns on `HOMEBREW_DEBUG` and
          # `HOMEBREW_VERBOSE` for every later step. That output can contain the registration secrets
          # in a form that GitHub cannot mask.
          debug: false

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-latest-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-latest-rubygems-

      - name: Trust the tap
        # An online audit fetches, and fetching runs this tap's custom download strategy, which
        # Homebrew refuses to do for an untrusted tap. Without this the audit fails on trust, and the
        # failure would not say so.
        run: brew trust --tap ${{ steps.set-up-homebrew.outputs.tap-name }}

      - name: Audit
        env:
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
          REQUESTED: ${{ inputs.casks }}
          # Read by `BmdConfig` for releases that need registration. Each audit of such a cask registers
          # the owner with Blackmagic again. Unset, those casks fail with a `BmdConfig` error that names
          # the missing fields. Do not add `--debug` or `--verbose`: they could log the request body.
          HOMEBREW_BMD_TAP_FIRSTNAME: ${{ secrets.HOMEBREW_BMD_TAP_FIRSTNAME }}
          HOMEBREW_BMD_TAP_LASTNAME: ${{ secrets.HOMEBREW_BMD_TAP_LASTNAME }}
          HOMEBREW_BMD_TAP_EMAIL: ${{ secrets.HOMEBREW_BMD_TAP_EMAIL }}
          HOMEBREW_BMD_TAP_PHONE: ${{ secrets.HOMEBREW_BMD_TAP_PHONE }}
          HOMEBREW_BMD_TAP_COMPANY: ${{ secrets.HOMEBREW_BMD_TAP_COMPANY }}
          HOMEBREW_BMD_TAP_STREET: ${{ secrets.HOMEBREW_BMD_TAP_STREET }}
          HOMEBREW_BMD_TAP_CITY: ${{ secrets.HOMEBREW_BMD_TAP_CITY }}
          HOMEBREW_BMD_TAP_STATE: ${{ secrets.HOMEBREW_BMD_TAP_STATE }}
          HOMEBREW_BMD_TAP_COUNTRY: ${{ secrets.HOMEBREW_BMD_TAP_COUNTRY }}
        run: |
          set -eu
          # Derived from the checked-out casks rather than listed here, so a cask added later is
          # audited by default instead of being silently skipped.
          casks="$REQUESTED"
          if [ -z "$casks" ]; then
            for path in "$(brew --repo "$TAP")"/Casks/*.rb; do
              token=$(basename "$path" .rb)
              case " $SKIP_CASKS " in
                *" $token "*) continue ;;
              esac
              casks="$casks $token"
            done
          fi

          echo "Auditing:$casks"
          echo "Skipping: $SKIP_CASKS"

          # One cask per invocation so the log says which one failed, and so a failure does not hide
          # the rest. `|| failed=...` collects them all before exiting non-zero.
          failed=""
          for cask in $casks; do
            echo "::group::brew audit --cask --online $cask"
            brew audit --cask --online "$TAP/$cask" || failed="$failed $cask"
            echo "::endgroup::"
          done

          if [ -n "$failed" ]; then
            echo "Failed:$failed"
            exit 1
          fi

      - name: Report to the failure issue
        # Scheduled runs only: a manual run of a few casks says nothing about the weekly result.
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: '"$(brew --repo "$TAP")/bin/report-run" "${{ job.status }}"'
