name: Copilot Setup Steps

# Prepares the Copilot coding agent's runner before it starts work. These steps run outside the
# agent's firewall; the agent's own commands run inside it (see AGENTS.md, "Copilot coding agent").
# Runs on changes to this file so a broken setup shows up on the PR, not in the agent's session.

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  # Copilot only picks up a job with exactly this name.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space for multi-GB vendor artifacts
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          cask: true

      - name: Enable the repository hooks
        run: git config core.hooksPath .githooks

      - name: Run bin/verify once
        # Proves the environment works and installs test-bot's gems before the firewall applies.
        run: bin/verify
