name: Assign ready issues to Copilot

# Software factory trigger: an open issue labelled `ready-for-agent` is handed to the Copilot coding
# agent, which works on it and opens a PR. Adding the label assigns at once. The daily run is a
# backstop that assigns the oldest labelled issue Copilot is not on yet, and only while Copilot has
# no open PR, so the queue drains one issue at a time. Human assignees do not block either path.

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch:

concurrency:
  # Per issue: a single shared group would drop all but one pending run when several are labelled.
  group: ${{ github.workflow }}-${{ github.event.issue.number || 'queue' }}
  cancel-in-progress: false

permissions: {}

jobs:
  assign:
    if: >-
      github.event_name != 'issues' ||
      (github.event.label.name == 'ready-for-agent' && github.event.issue.state == 'open')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout assignment script
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Assign to Copilot
        env:
          # GITHUB_TOKEN cannot assign Copilot. Needs a PAT of a Copilot-licensed user with read/write on
          # this repo's Actions, Contents, Issues and Pull requests.
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LABELLED_ISSUE: ${{ github.event.issue.number }}
        run: bash bin/assign-copilot
