name: Assign ready issues to Copilot

# Assign every ready, unblocked issue to Copilot when readiness or completion changes, without polling.

on:
  issues:
    types: [opened, labeled, unlabeled, reopened, closed, unassigned]
  # Use the trusted base workflow and script, including when a PR is closed without merging.
  pull_request_target:
    types: [closed]
  workflow_dispatch:

concurrency:
  # Coalesce events: every surviving run scans the full live queue.
  group: ${{ github.workflow }}-queue
  cancel-in-progress: false

permissions: {}

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout assignment script
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Assign to Copilot
        env:
          # GITHUB_TOKEN cannot assign Copilot. Needs a PAT of a Copilot-licensed user with read/write on
          # this repo's Actions, Contents, Issues and Pull requests.
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash bin/assign-copilot
