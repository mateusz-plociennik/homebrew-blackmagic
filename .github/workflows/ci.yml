name: CI

on:
  # No `push` on main: every change lands via a PR that already ran this, and direct pushes are
  # gated by `.githooks/pre-commit` running `bin/verify`.
  pull_request:
  # `bump.yml` dispatches this for each bump PR it opens: a PR authored by `GITHUB_TOKEN` only gets a
  # `pull_request` run that waits for manual approval, but `workflow_dispatch` is exempt from that rule.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose changed casks the install job should test
        type: string
        required: true

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test-bot:
    # Style, offline audit and pure-Ruby tests: nothing here needs macOS.
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          cask: true

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ubuntu-latest-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ubuntu-latest-rubygems-

      - name: Run brew test-bot --only-cleanup-before
        run: brew test-bot --only-cleanup-before

      - name: Run brew test-bot --only-setup
        run: brew test-bot --only-setup

      - name: Run brew test-bot --only-tap-syntax
        run: brew test-bot --only-tap-syntax

      - name: Run the catalog tests
        # `test-bot --only-tap-syntax` is style and audit; it runs no behaviour. `brew ruby` is what can
        # load `utils/curl`, which `BmdCatalog` requires. The tests themselves make no network calls.
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/bmd_catalog_test.rb"

      - name: Run the registration config tests
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/bmd_config_test.rb"

      - name: Run the resolve-request tests
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/bmd_resolver_test.rb"

      - name: Run the terms-and-conditions tests
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/bmd_terms_test.rb"

      - name: Run the cask generator tests
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/bmd_cask_generator_test.rb"

      - name: Run the native cask uninstaller tests
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/cask_uninstall_test.rb"

      - name: Run the missing-products report tests
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/bmd_product_report_test.rb"

      - name: Run the receipt comparison tests
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/compare_receipts_test.rb"

      - name: Run the bump CI dispatch tests
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/dispatch_bump_ci_test.rb"

      - name: Run the Copilot assignment tests
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/assign_copilot_test.rb"

      - name: Run the factory loop tests
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/factory_pr_test.rb"

      - name: Run the bump and run-report tests
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/bump_casks_test.rb"

      - name: Run the changed-casks tests
        run: bash "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/changed_casks_test.sh"

  install:
    # What the offline checks cannot prove about a new release: that its `pkg` name still matches, and
    # that `uninstall pkgutil:` removes every receipt it writes. Downloads the artifact, so PRs only.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      # Resolve: same reason as `audit-online.yml`, registration-path casks need a real identity.
      # Cintel: its uninstall script deactivates a driver extension, which waits for user approval.
      # Resolve Studio: uninstall deliberately keeps the Fairlight driver and RAW Player receipts, as
      # Blackmagic's uninstaller does, so receipt equality cannot hold.
      SKIP_CASKS: blackmagic-davinci-resolve blackmagic-davinci-resolve-studio blackmagic-cintel
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          cask: true

      - name: Trust the tap
        run: brew trust --tap ${{ steps.set-up-homebrew.outputs.tap-name }}

      - name: List the casks this PR changes
        id: changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          repo=$(brew --repo "$TAP")
          casks=$("$repo/bin/changed-casks")
          echo "casks=$casks" >> "$GITHUB_OUTPUT"

      - name: Install and uninstall each changed cask
        # A cask prompting for approval hangs rather than fails; cap it below the 6h default.
        timeout-minutes: 60
        # No token in this step: `brew install` evaluates the PR's cask Ruby.
        env:
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
          CASKS: ${{ steps.changed.outputs.casks }}
        # Receipt equality does not prove shared payload survived: pkgutil removes files a neighbour's
        # receipt also claims (see Casks/blackmagic-davinci-resolve.rb). Shared components need targeted checks.
        run: |
          set -euo pipefail
          [ -n "$CASKS" ] || { echo "No casks changed"; exit 0; }
          compare="$(brew --repo "$TAP")/bin/compare-receipts"
          snapshots=$(mktemp -d)
          desktop_video_shared_receipts="$snapshots/desktop-video-shared-receipts"
          cat > "$desktop_video_shared_receipts" <<'RECEIPTS'
          com.blackmagic-design.DesktopVideo
          com.blackmagic-design.DesktopVideoAssets
          com.blackmagic-design.DiskSpeedTest
          com.blackmagic-design.MediaExpress
          RECEIPTS
          desktop_video_installed_receipts="$snapshots/desktop-video-installed-receipts"
          cat > "$desktop_video_installed_receipts" <<'RECEIPTS'
          com.blackmagic-design.DesktopVideo
          com.blackmagic-design.DesktopVideoAssets
          com.blackmagic-design.DesktopVideoUninstaller
          com.blackmagic-design.DiskSpeedTest
          com.blackmagic-design.MediaExpress
          RECEIPTS

          failed=""
          for cask in $CASKS; do
            case " $SKIP_CASKS " in
              *" $cask "*) echo "::notice::Skipping $cask: cannot install unattended, install it locally"; continue ;;
            esac
            echo "::group::$cask"
            # Outside any `if`, so a failing pkgutil stops the step instead of reading as no receipts.
            pkgutil --pkgs > "$snapshots/before"
            install_failed=0
            if brew install --cask "$TAP/$cask"; then
              if [ "$cask" = blackmagic-desktop-video ]; then
                pkgutil --pkgs > "$snapshots/desktop-video-installed"
                comm -13 <(sort -u "$snapshots/before") <(sort -u "$snapshots/desktop-video-installed") \
                  > "$snapshots/desktop-video-added"
                if ! diff -u <(sort -u "$desktop_video_installed_receipts") "$snapshots/desktop-video-added"; then
                  echo "::error::Desktop Video did not install exactly its five expected receipts"
                  failed="$failed $cask"
                fi
              fi
            else
              failed="$failed $cask"
              install_failed=1
            fi
            if [ "$install_failed" -eq 0 ]; then
              if brew uninstall --cask "$TAP/$cask"; then
                pkgutil --pkgs > "$snapshots/after"
                if [ "$cask" = blackmagic-desktop-video ]; then
                  sort -u "$snapshots/after" > "$snapshots/desktop-video-after.sorted"
                  comm -13 <(sort -u "$snapshots/before") "$snapshots/desktop-video-after.sorted" \
                    > "$snapshots/desktop-video-retained"
                  if ! diff -u <(sort -u "$desktop_video_shared_receipts") "$snapshots/desktop-video-retained"; then
                    echo "::error::Desktop Video did not retain exactly the shared runtime receipts"
                    failed="$failed $cask"
                  fi
                  removed_receipts="$(comm -23 <(sort -u "$snapshots/before") "$snapshots/desktop-video-after.sorted")"
                  if [ -n "$removed_receipts" ]; then
                    echo "::error::Desktop Video uninstall removed pre-existing receipts: ${removed_receipts//$'\n'/; }"
                    failed="$failed $cask"
                  fi
                  for path in \
                    "/Applications/Blackmagic Desktop Video/Desktop Video Setup.app" \
                    "/Applications/Blackmagic Desktop Video/Media Player Setup.app" \
                    "/Applications/Blackmagic Media Express.app" \
                    "/Applications/Blackmagic Disk Speed Test.app" \
                    "/Library/Frameworks/DeckLinkAPI.framework" \
                    "/Library/Application Support/Blackmagic Design/Blackmagic Desktop Video Driver Extension.app" \
                    "/Library/Application Support/Blackmagic Design/Streaming/BMDStreamingAPI.bundle" \
                    "/Library/LaunchDaemons/com.blackmagic-design.DesktopVideoHelper.plist"; do
                    if [ ! -e "$path" ]; then
                      echo "::error::Desktop Video uninstall removed shared payload $path"
                      failed="$failed $cask"
                    fi
                  done
                  for path in \
                    "/Applications/Blackmagic Desktop Video/Documents" \
                    "/Applications/Blackmagic Desktop Video/Uninstall Desktop Video.app"; do
                    if [ -e "$path" ]; then
                      echo "::error::Desktop Video uninstall left product-owned payload $path"
                      failed="$failed $cask"
                    fi
                  done
                elif ! diff=$("$compare" "$snapshots/before" "$snapshots/after"); then
                  echo "::error::$cask ${diff//$'\n'/; }"
                  failed="$failed $cask"
                fi
              else
                failed="$failed $cask"
              fi
            fi
            echo "::endgroup::"
          done

          [ -z "$failed" ] || { echo "Failed:$failed"; exit 1; }
