name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # `bump.yml` dispatches this for each bump PR it opens: a PR authored by `GITHUB_TOKEN` fires no
  # `pull_request` run, but `workflow_dispatch` is exempt from that rule.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose changed casks the install job should test
        type: string
        required: true

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test-bot:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          # This tap is private, so the action needs a token to check it out.
          token: ${{ secrets.GITHUB_TOKEN }}
          cask: true

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-latest-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-latest-rubygems-

      - name: Run brew test-bot --only-cleanup-before
        run: brew test-bot --only-cleanup-before

      - name: Run brew test-bot --only-setup
        run: brew test-bot --only-setup

      - name: Run brew test-bot --only-tap-syntax
        run: brew test-bot --only-tap-syntax

      - name: Run the catalog tests
        # `test-bot --only-tap-syntax` is style and audit; it runs no behaviour. `brew ruby` is what can
        # load `utils/curl`, which `BmdCatalog` requires. The tests themselves make no network calls.
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/bmd_catalog_test.rb"

      - name: Run the registration config tests
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/bmd_config_test.rb"

      - name: Run the resolve-request tests
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/bmd_resolver_test.rb"

      - name: Run the terms-and-conditions tests
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/bmd_terms_test.rb"

      - name: Run the cask generator tests
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/bmd_cask_generator_test.rb"

      - name: Run the missing-products report tests
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/bmd_product_report_test.rb"

      - name: Run the receipt comparison tests
        run: brew ruby "$(brew --repo ${{ steps.set-up-homebrew.outputs.tap-name }})/test/compare_receipts_test.rb"

  install:
    # What the offline checks cannot prove about a new release: that its `pkg` name still matches, and
    # that `uninstall pkgutil:` removes every receipt it writes. Downloads the artifact, so PRs only.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      # Same list and reason as `audit-online.yml`: registration-path casks need a real identity.
      SKIP_CASKS: blackmagic-davinci-resolve
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          cask: true

      - name: Trust the tap
        run: brew trust --tap ${{ steps.set-up-homebrew.outputs.tap-name }}

      - name: List the casks this PR changes
        id: changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          # The PR's own diff, not a diff against main, so casks main changed since don't get installed.
          # Existence check drops casks the PR deletes or renames away.
          casks=""
          for cask in $(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only | sed -n 's|^Casks/\(.*\)\.rb$|\1|p'); do
            if [ -f "$(brew --repo "$TAP")/Casks/$cask.rb" ]; then casks="$casks $cask"; fi
          done
          echo "casks=$casks" >> "$GITHUB_OUTPUT"

      - name: Install and uninstall each changed cask
        # No token in this step: `brew install` evaluates the PR's cask Ruby.
        env:
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
          CASKS: ${{ steps.changed.outputs.casks }}
        # Receipt equality does not prove shared payload survived: pkgutil removes files a neighbour's
        # receipt also claims (see HANDOFF.md, DaVinci Resolve). Shared components need targeted checks.
        run: |
          set -euo pipefail
          [ -n "$CASKS" ] || { echo "No casks changed"; exit 0; }
          compare="$(brew --repo "$TAP")/bin/compare-receipts"
          snapshots=$(mktemp -d)

          failed=""
          for cask in $CASKS; do
            case " $SKIP_CASKS " in
              *" $cask "*) echo "::notice::Skipping $cask: registration-gated, install it locally"; continue ;;
            esac
            echo "::group::$cask"
            # Outside any `if`, so a failing pkgutil stops the step instead of reading as no receipts.
            pkgutil --pkgs > "$snapshots/before"
            if brew install --cask "$TAP/$cask" && brew uninstall --cask "$TAP/$cask"; then
              pkgutil --pkgs > "$snapshots/after"
              if ! diff=$("$compare" "$snapshots/before" "$snapshots/after"); then
                echo "::error::$cask ${diff//$'\n'/; }"
                failed="$failed $cask"
              fi
            else
              failed="$failed $cask"
            fi
            echo "::endgroup::"
          done

          [ -z "$failed" ] || { echo "Failed:$failed"; exit 1; }
